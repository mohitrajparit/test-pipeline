services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: todos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/todos
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - db
  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - server
volumes:
  postgres_data:
